name: terraform

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

# Least privilege by default; jobs widen it only where needed.
permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TF_VERSION: "1.16.4"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true" # backend uses Entra ID, not storage account keys
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  # Modules applied locally with `az login`, never by the pipeline.
  # They are still fmt-checked and validated, but not planned or applied.
  LOCAL_ONLY_MODULES: "infra/bootstrap infra/identity"

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: terraform-plan-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_PLAN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_PLAN }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: fmt, init, validate, plan
        run: |
          set -euo pipefail
          modules=$(find infra -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u)

          for m in $modules; do
            echo "::group::$m"
            terraform -chdir="$m" fmt -check -diff

            if [[ " $LOCAL_ONLY_MODULES " == *" $m "* ]]; then
              terraform -chdir="$m" init -backend=false
              terraform -chdir="$m" validate
              echo "::notice title=$m::local-only module, plan skipped"
            else
              terraform -chdir="$m" init
              terraform -chdir="$m" validate
              terraform -chdir="$m" plan -lock=false
            fi
            echo "::endgroup::"
          done

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod # required reviewers gate this job; OIDC subject = environment:prod
    permissions:
      id-token: write
      contents: read
    # Never run two applies at once; queued runs wait instead of being cancelled.
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_APPLY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_APPLY }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: init, apply
        run: |
          set -euo pipefail
          modules=$(find infra -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u)

          for m in $modules; do
            if [[ " $LOCAL_ONLY_MODULES " == *" $m "* ]]; then
              echo "::notice title=$m::local-only module, apply skipped"
              continue
            fi
            echo "::group::$m"
            terraform -chdir="$m" init
            terraform -chdir="$m" apply -auto-approve
            echo "::endgroup::"
          done
