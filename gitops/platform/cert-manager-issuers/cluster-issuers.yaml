# DNS-01 in the Azure DNS zone k8s.clusteryard.dev (infra/dns). id-cert-manager has
# DNS Zone Contributor on exactly this zone (ADR 0006). No HTTP-01: it would need
# an ingress reachable from the internet before the first certificate.
#
# Use letsencrypt-staging to test (untrusted certificates, high rate limits),
# letsencrypt-prod for real certificates. No e-mail: Let's Encrypt no longer
# sends expiry mails, and the repository is public.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - dns01:
          azureDNS:
            environment: AzurePublicCloud
            subscriptionID: 678c11b0-ff2e-44fb-8cbd-f7d3a849c3b0
            resourceGroupName: rg-dns
            hostedZoneName: k8s.clusteryard.dev
            managedIdentity:
              clientID: fb098555-74ac-4ee4-a423-1f2fd44f8756 # id-cert-manager
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - dns01:
          azureDNS:
            environment: AzurePublicCloud
            subscriptionID: 678c11b0-ff2e-44fb-8cbd-f7d3a849c3b0
            resourceGroupName: rg-dns
            hostedZoneName: k8s.clusteryard.dev
            managedIdentity:
              clientID: fb098555-74ac-4ee4-a423-1f2fd44f8756 # id-cert-manager
