# Wildcard certificate for the HTTPS listener, via DNS-01 (ADR 0008). Apps get
# TLS without their own Certificate.
#
# Let's Encrypt allows 5 certificates per exact set of names per 7 days. Every
# rebuild of the cluster requests a new one (the secret goes with the cluster).
# More than about 5 rebuilds a week: switch to letsencrypt-staging (ADR 0009).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-k8s-clusteryard-dev
  namespace: gateway
spec:
  secretName: wildcard-k8s-clusteryard-dev-tls
  dnsNames:
    - "*.k8s.clusteryard.dev"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
