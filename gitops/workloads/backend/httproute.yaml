# https://backend.k8s.clusteryard.dev/api via the public Gateway (ADR 0009).
# Only /api is routed: /actuator (health, metrics) stays inside the cluster.
# external-dns creates the DNS record from the hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend
  namespace: backend
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: https
  hostnames:
    - backend.k8s.clusteryard.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: backend
          port: 80
